[package]
name = "gpu-observer"
version = "1.0.0"
edition = "2021"
description = "GPU 观察 - SSH 服务器 GPU/内存监控托盘应用 (Rust 重写版)"
license = "MIT"
build = "build.rs"

[[bin]]
name = "GPUObserver"
path = "src/main.rs"

[dependencies]
windows = { version = "0.62", features = [
    "Win32_Graphics_Gdi",
    "Win32_Graphics_GdiPlus",
    "Win32_Graphics_Dwm",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_SystemServices",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_IO",
    "Win32_Security",
    "Win32_System_Pipes",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "UI_Notifications",
    "Data_Xml_Dom",
] }
windows-core = "0.62"
russh = { version = "0.64", default-features = false, features = ["ring", "rsa", "flate2"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time", "net", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
winreg = "0.56"
base64 = "0.22"
sha2 = "0.10"
chrono = { version = "0.4", features = ["clock"] }

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = 2
lto = "thin"
